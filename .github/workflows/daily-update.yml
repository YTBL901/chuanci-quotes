name: 每日自动更新语录

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  crawl-and-commit:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: 检出仓库
        uses: actions/checkout@v4
      - name: 设置 Python 环境
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: 安装依赖
        run: pip install requests
      - name: 运行爬虫生成 quotes.json
        run: python crawler.py
      - name: 提交并推送更新
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add quotes.json
          if git diff --cached --quiet; then
            echo "本次没有新增数据，跳过提交"
                    else
            git commit -m "自动更新语录 $(date +%Y-%m-%d)"
            # 推送前先同步远端，避免"你刚在手机上提交过文件"导致的冲突
            git pull --rebase origin main
            git push
          fi
